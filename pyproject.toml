[project]
name = "plotio"
version = "0.1.0"
description = "Render Draw.io diagrams as native Matplotlib artists."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ido Ben-Yair", email = "ido.benyair@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["drawio", "matplotlib", "diagram", "visualization", "rendering", "figures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
]

[project.urls]
Homepage = "https://github.com/idoby/plotio"
Repository = "https://github.com/idoby/plotio"
Issues = "https://github.com/idoby/plotio/issues"

[project.scripts]
plotio = "plotio.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.0",
    "tox>=4.58.0",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff]
line-length = 120
